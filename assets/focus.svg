<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" fill="none" role="img" aria-label="What I build — computer vision, applied LLMs, shipped products">
  <defs>
    <style>
      .sw { animation: sweep 3.4s ease-in-out infinite; }
      @keyframes sweep { 0%,100% { transform: translateY(0) } 50% { transform: translateY(30px) } }
      .tk { animation: tick 2.7s steps(1) infinite; }
      .tk.b { animation-delay: .9s } .tk.c { animation-delay: 1.8s }
      @keyframes tick { 0%,32% { opacity: 1 } 33%,100% { opacity: .25 } }
      .bar { animation: grow 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
      @keyframes grow { 0%,100% { transform: scaleY(.5) } 50% { transform: scaleY(1) } }
      @media (prefers-reduced-motion: reduce) { .sw,.tk,.bar { animation: none } }
    </style>
  </defs>

  <rect width="1200" height="236" fill="#000000"/>

  <!-- section head -->
  <g font-family="'JetBrains Mono', Menlo, Consolas, ui-monospace, monospace" font-size="11" letter-spacing="2.2" fill="#8A8A8A">
    <rect x="56" y="32" width="7" height="7" fill="#FFFFFF"/>
    <text x="75" y="39">WHAT I BUILD</text>
  </g>
  <rect x="56" y="56" width="1088" height="1" fill="#2A2A2A"/>

  <!-- column rules -->
  <rect x="418" y="80" width="1" height="112" fill="#2A2A2A"/>
  <rect x="780" y="80" width="1" height="112" fill="#2A2A2A"/>

  <!-- ============ computer vision ============ -->
  <g transform="translate(56 84)">
    <g>
      <rect x="0" y="2" width="52" height="40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <rect class="sw" x="4" y="6" width="44" height="2" fill="#FFFFFF"/>
      <rect x="13" y="15" width="14" height="12" fill="none" stroke="#8A8A8A" stroke-width="2"/>
      <rect x="32" y="21" width="11" height="9"  fill="none" stroke="#8A8A8A" stroke-width="2"/>
    </g>
    <text x="70" y="18" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="800" font-size="19" letter-spacing="-0.7" fill="#FFFFFF">Computer vision</text>
    <g font-family="'JetBrains Mono', Menlo, Consolas, ui-monospace, monospace" font-size="12.5" fill="#8A8A8A">
      <text x="70" y="42">Detection pipelines that run</text>
      <text x="70" y="62">on ordinary hardware.</text>
      <text x="70" y="92" fill="#FFFFFF" font-size="11" letter-spacing="1.4">OPENCV · TENSORFLOW</text>
    </g>
  </g>

  <!-- ============ applied LLMs ============ -->
  <g transform="translate(452 84)">
    <g>
      <rect x="0" y="2" width="52" height="40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <g fill="#FFFFFF">
        <rect class="tk"   x="8"  y="12" width="12" height="4"/>
        <rect class="tk b" x="23" y="12" width="19" height="4"/>
        <rect class="tk c" x="8"  y="21" width="23" height="4"/>
        <rect class="tk"   x="34" y="21" width="8"  height="4"/>
        <rect class="tk b" x="8"  y="30" width="15" height="4"/>
      </g>
    </g>
    <text x="70" y="18" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="800" font-size="19" letter-spacing="-0.7" fill="#FFFFFF">Applied LLMs</text>
    <g font-family="'JetBrains Mono', Menlo, Consolas, ui-monospace, monospace" font-size="12.5" fill="#8A8A8A">
      <text x="70" y="42">Agents that take actions,</text>
      <text x="70" y="62">not just turns.</text>
      <text x="70" y="92" fill="#FFFFFF" font-size="11" letter-spacing="1.4">RAG · TOOL-USE</text>
    </g>
  </g>

  <!-- ============ shipped products ============ -->
  <g transform="translate(814 84)">
    <g>
      <rect x="0" y="2" width="52" height="40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <g fill="#FFFFFF">
        <rect class="bar" x="9"  y="26" width="8" height="10"/>
        <rect class="bar" x="22" y="20" width="8" height="16" style="animation-delay:.5s"/>
        <rect class="bar" x="35" y="13" width="8" height="23" style="animation-delay:1s"/>
      </g>
    </g>
    <text x="70" y="18" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="800" font-size="19" letter-spacing="-0.7" fill="#FFFFFF">Shipped products</text>
    <g font-family="'JetBrains Mono', Menlo, Consolas, ui-monospace, monospace" font-size="12.5" fill="#8A8A8A">
      <text x="70" y="42">Live on real domains, with</text>
      <text x="70" y="62">real users on them.</text>
      <text x="70" y="92" fill="#FFFFFF" font-size="11" letter-spacing="1.4">NEXT.JS · CONVEX · VERCEL</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="235" fill="none" stroke="#2A2A2A" stroke-width="1"/>
</svg>
