<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" fill="none" role="img" aria-label="Focus areas: Computer Vision, Applied LLMs, Full-Stack Delivery">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1200" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.5" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#0A1622"/>
    </linearGradient>
    <pattern id="fgrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1B2942" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <radialGradient id="fglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fcard"><rect width="1200" height="230" rx="18"/></clipPath>
    <style>
      .scan  { animation: sc 3.2s ease-in-out infinite; }
      @keyframes sc { 0%,100%{ transform: translateY(0); opacity:.85 } 50%{ transform: translateY(34px); opacity:.35 } }
      .blip  { animation: bl 2.4s ease-in-out infinite; }
      @keyframes bl { 0%,100%{ opacity:.35 } 50%{ opacity:1 } }
      .bar   { animation: gw 3.6s ease-in-out infinite; transform-box: fill-box; }
      @keyframes gw { 0%,100%{ transform: scaleX(.55) } 50%{ transform: scaleX(1) } }
      .tok   { animation: tk 2.8s steps(1) infinite; }
      @keyframes tk { 0%,32%{opacity:1} 33%,100%{opacity:.22} }
      .tok.b { animation-delay:.9s } .tok.c { animation-delay:1.8s }
    </style>
  </defs>

  <g clip-path="url(#fcard)">
    <rect width="1200" height="230" fill="url(#fbg)"/>
    <rect width="1200" height="230" fill="url(#fgrid)" opacity="0.5"/>
    <ellipse cx="600" cy="30" rx="520" ry="150" fill="url(#fglow)"/>

    <!-- header -->
    <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
      <rect x="46" y="30" width="6" height="6" fill="#2DD4BF"/>
      <text x="66" y="37" font-size="12.5" letter-spacing="4" fill="#5EEAD4" font-weight="600">WHAT I BUILD</text>
    </g>

    <!-- dividers -->
    <rect x="400" y="66" width="1" height="128" fill="#1B2942"/>
    <rect x="800" y="66" width="1" height="128" fill="#1B2942"/>

    <!-- ============ 1. Computer Vision ============ -->
    <g transform="translate(46 78)">
      <g transform="translate(0 4)">
        <rect x="0" y="0" width="56" height="44" rx="6" fill="none" stroke="#2DD4BF" stroke-width="1.6" stroke-opacity="0.75"/>
        <rect class="scan" x="4" y="6" width="48" height="1.6" fill="#2DD4BF"/>
        <rect x="14" y="16" width="15" height="13" rx="2" fill="none" stroke="#5EEAD4" stroke-width="1.4" stroke-opacity="0.9"/>
        <rect x="34" y="22" width="12" height="10" rx="2" fill="none" stroke="#5EEAD4" stroke-width="1.4" stroke-opacity="0.5"/>
        <circle class="blip" cx="21" cy="22" r="2.2" fill="#2DD4BF"/>
      </g>
      <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
        <text x="74" y="20" font-size="19" font-weight="700" fill="#E6EDF5">Computer Vision</text>
        <text x="74" y="45" font-size="13.5" fill="#8FA3BC">Real-time detection pipelines that</text>
        <text x="74" y="64" font-size="13.5" fill="#8FA3BC">run on ordinary hardware.</text>
      </g>
      <g font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#5EEAD4">
        <rect x="74" y="80" width="60" height="20" rx="4" fill="#0E2A2A" stroke="#164E4A"/>
        <text x="83" y="94">OpenCV</text>
        <rect x="142" y="80" width="80" height="20" rx="4" fill="#0E2A2A" stroke="#164E4A"/>
        <text x="151" y="94">TensorFlow</text>
      </g>
    </g>

    <!-- ============ 2. Applied LLMs ============ -->
    <g transform="translate(446 78)">
      <g transform="translate(0 4)">
        <rect x="0" y="0" width="56" height="44" rx="6" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-opacity="0.75"/>
        <g fill="#A78BFA">
          <rect class="tok"   x="9"  y="14" width="13" height="4.5" rx="2"/>
          <rect class="tok b" x="25" y="14" width="20" height="4.5" rx="2"/>
          <rect class="tok c" x="9"  y="24" width="24" height="4.5" rx="2"/>
          <rect class="tok"   x="36" y="24" width="9"  height="4.5" rx="2"/>
          <rect class="tok b" x="9"  y="34" width="16" height="4.5" rx="2"/>
        </g>
      </g>
      <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
        <text x="74" y="20" font-size="19" font-weight="700" fill="#E6EDF5">Applied LLMs</text>
        <text x="74" y="45" font-size="13.5" fill="#8FA3BC">Agentic apps where the model</text>
        <text x="74" y="64" font-size="13.5" fill="#8FA3BC">takes actions, not just answers.</text>
      </g>
      <g font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#C4B5FD">
        <rect x="74" y="80" width="52" height="20" rx="4" fill="#1E1B36" stroke="#3B2F6B"/>
        <text x="83" y="94">RAG</text>
        <rect x="134" y="80" width="76" height="20" rx="4" fill="#1E1B36" stroke="#3B2F6B"/>
        <text x="143" y="94">Tool-use</text>
      </g>
    </g>

    <!-- ============ 3. Full-Stack Delivery ============ -->
    <g transform="translate(846 78)">
      <g transform="translate(0 4)">
        <rect x="0" y="0" width="56" height="44" rx="6" fill="none" stroke="#F472B6" stroke-width="1.6" stroke-opacity="0.75"/>
        <g fill="#F472B6">
          <rect class="bar" x="10" y="30" width="9"  height="8"  rx="1.5"/>
          <rect class="bar" x="23" y="24" width="9"  height="14" rx="1.5" style="animation-delay:.5s"/>
          <rect class="bar" x="36" y="16" width="9"  height="22" rx="1.5" style="animation-delay:1s"/>
        </g>
        <rect x="10" y="10" width="16" height="2.5" rx="1.2" fill="#F472B6" opacity="0.5"/>
      </g>
      <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
        <text x="74" y="20" font-size="19" font-weight="700" fill="#E6EDF5">Shipped Products</text>
        <text x="74" y="45" font-size="13.5" fill="#8FA3BC">Deployed, monitored apps with</text>
        <text x="74" y="64" font-size="13.5" fill="#8FA3BC">real users on real domains.</text>
      </g>
      <g font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#F9A8D4">
        <rect x="74" y="80" width="60" height="20" rx="4" fill="#2E1626" stroke="#6B2E4F"/>
        <text x="83" y="94">Next.js</text>
        <rect x="142" y="80" width="56" height="20" rx="4" fill="#2E1626" stroke="#6B2E4F"/>
        <text x="151" y="94">Vercel</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="229" rx="18" fill="none" stroke="#1B2942" stroke-width="1"/>
  </g>
</svg>
