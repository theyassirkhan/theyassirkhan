<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="Muhammed Yassir Khan — AI and Data Science Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#0A1A24"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="60" y1="150" x2="700" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="0.45" stop-color="#4FC3F7"/>
      <stop offset="0.75" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
      <animate attributeName="x1" values="60;-240;60" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="700;1000;700" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="1"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1B2942" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>

    <style>
      .role   { opacity: 0; animation: cyc 13.5s infinite; }
      .role.r2{ animation-delay: 4.5s; }
      .role.r3{ animation-delay: 9s; }
      @keyframes cyc {
        0%   { opacity: 0; transform: translateY(7px); }
        4%   { opacity: 1; transform: translateY(0); }
        29%  { opacity: 1; transform: translateY(0); }
        34%  { opacity: 0; transform: translateY(-7px); }
        100% { opacity: 0; transform: translateY(-7px); }
      }
      .node   { animation: pulse 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
      .edge   { stroke-dasharray: 5 9; animation: flow 2.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .drift  { animation: drift 16s ease-in-out infinite; }
      @keyframes drift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-13px)} }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity="0.5"/>

    <!-- ambient light -->
    <ellipse class="drift" cx="960" cy="120" rx="330" ry="230" fill="url(#glowTeal)"/>
    <ellipse cx="150" cy="300" rx="300" ry="200" fill="url(#glowViolet)"/>

    <!-- ================= neural graph ================= -->
    <g transform="translate(742 44)" opacity="0.95">
      <g stroke="#2DD4BF" stroke-width="1.15" stroke-opacity="0.42" fill="none">
        <path class="edge" d="M40 68 L152 40 M40 68 L152 104 M40 68 L152 168"/>
        <path class="edge" d="M40 132 L152 40 M40 132 L152 104 M40 132 L152 168"/>
        <path class="edge" d="M40 196 L152 104 M40 196 L152 168 M40 196 L152 232"/>
      </g>
      <g stroke="#A78BFA" stroke-width="1.15" stroke-opacity="0.42" fill="none">
        <path class="edge" d="M152 40 L268 76 M152 104 L268 76 M152 104 L268 148"/>
        <path class="edge" d="M152 168 L268 148 M152 168 L268 216 M152 232 L268 216"/>
      </g>
      <g stroke="#F472B6" stroke-width="1.15" stroke-opacity="0.40" fill="none">
        <path class="edge" d="M268 76 L370 146 M268 148 L370 146 M268 216 L370 146"/>
      </g>

      <g fill="#0B1222" stroke="#2DD4BF" stroke-width="1.7">
        <circle class="node" cx="40"  cy="68"  r="7"/>
        <circle class="node" cx="40"  cy="132" r="7" style="animation-delay:.4s"/>
        <circle class="node" cx="40"  cy="196" r="7" style="animation-delay:.8s"/>
      </g>
      <g fill="#0B1222" stroke="#5EEAD4" stroke-width="1.7">
        <circle class="node" cx="152" cy="40"  r="6.5" style="animation-delay:.2s"/>
        <circle class="node" cx="152" cy="104" r="6.5" style="animation-delay:.6s"/>
        <circle class="node" cx="152" cy="168" r="6.5" style="animation-delay:1s"/>
        <circle class="node" cx="152" cy="232" r="6.5" style="animation-delay:1.4s"/>
      </g>
      <g fill="#0B1222" stroke="#A78BFA" stroke-width="1.7">
        <circle class="node" cx="268" cy="76"  r="6.5" style="animation-delay:.5s"/>
        <circle class="node" cx="268" cy="148" r="6.5" style="animation-delay:.9s"/>
        <circle class="node" cx="268" cy="216" r="6.5" style="animation-delay:1.3s"/>
      </g>
      <circle cx="370" cy="146" r="13" fill="#F472B6" opacity="0.16" filter="url(#soft)"/>
      <circle class="node" cx="370" cy="146" r="8.5" fill="#0B1222" stroke="#F472B6" stroke-width="2"/>
    </g>

    <!-- ================= type ================= -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <!-- eyebrow -->
      <g transform="translate(62 74)">
        <rect x="-1" y="-13" width="7" height="7" fill="#2DD4BF"/>
        <text x="20" y="-6" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace"
              font-size="13" letter-spacing="4.2" fill="#5EEAD4" font-weight="600">AI &amp; DATA SCIENCE ENGINEER</text>
      </g>

      <text x="60" y="176" font-size="62" font-weight="800" letter-spacing="-1.6" fill="url(#nameGrad)">Muhammed Yassir Khan</text>

      <!-- cycling roles -->
      <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">
        <text x="62" y="222" fill="#2DD4BF" font-weight="700">&#8250;</text>
        <g fill="#B6C4D8">
          <text class="role"    x="84" y="222">building real-time computer vision systems</text>
          <text class="role r2" x="84" y="222">shipping production LLM &amp; agentic apps</text>
          <text class="role r3" x="84" y="222">turning models into products people use</text>
        </g>
      </g>

      <!-- stat strip -->
      <g transform="translate(62 268)" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12.5" letter-spacing="1.6">
        <g fill="#64748B">
          <text x="0"   y="0">BENGALURU, IN</text>
          <text x="182" y="0" fill="#94A3B8">MYK PRODUCTIONS</text>
          <text x="384" y="0">B.TECH AI &amp; DS &#8217;26</text>
          <text x="592" y="0">OPEN TO ROLES</text>
        </g>
        <g fill="#1E293B">
          <rect x="160" y="-11" width="1" height="13"/>
          <rect x="362" y="-11" width="1" height="13"/>
          <rect x="570" y="-11" width="1" height="13"/>
        </g>
      </g>
    </g>

    <!-- sweeping accent line -->
    <rect x="0" y="336" width="1200" height="4" fill="#111C2E"/>
    <rect x="-380" y="336" width="380" height="4" fill="url(#sweep)">
      <animate attributeName="x" values="-380;1200" dur="4.2s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#1B2942" stroke-width="1"/>
  </g>
</svg>
