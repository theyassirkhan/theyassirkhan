<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="Muhammed Yassir Khan — MYK Productions">
  <defs>
    <!-- master monogram construction, per brand guidelines: glyph knocked out of a solid square -->
    <mask id="knock" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect x="0" y="0" width="120" height="120" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="12" stroke-linejoin="miter">
        <path d="M38,38 L62,60 L38,82"/><path d="M70,82 L92,82"/>
      </g>
    </mask>
    <style>
      .cur  { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
      .role { opacity: 0; animation: cyc 13.5s infinite; }
      .role.b { animation-delay: 4.5s }
      .role.c { animation-delay: 9s }
      @keyframes cyc {
        0%   { opacity: 0 }
        3%   { opacity: 1 }
        30%  { opacity: 1 }
        33%  { opacity: 0 }
        100% { opacity: 0 }
      }
      @media (prefers-reduced-motion: reduce) {
        .cur { animation: none }
        .role { animation: none; opacity: 0 }
        .role.a { opacity: 1 }
      }
    </style>
  </defs>

  <rect width="1200" height="340" fill="#000000"/>

  <!-- prompt line -->
  <g font-family="'JetBrains Mono', Menlo, Consolas, ui-monospace, monospace" font-size="12" fill="#8A8A8A">
    <text x="56" y="40" textLength="336" lengthAdjust="spacing">~/MYK-PRODUCTIONS/PROFILE $ CAT README.MD</text>
    <rect class="cur" x="400" y="30" width="8" height="13" fill="#FFFFFF"/>
    <text x="1144" y="40" text-anchor="end" letter-spacing="1.6">V1.0</text>
  </g>

  <!-- 2px white rule, reserved for the header -->
  <rect x="56" y="54" width="1088" height="2" fill="#FFFFFF"/>

  <!-- monogram · 96px, clear space held at a quarter square -->
  <g transform="translate(56 104) scale(0.8)" mask="url(#knock)">
    <rect width="120" height="120" fill="#FFFFFF"/>
  </g>

  <!-- name -->
  <text x="179" y="152"
        font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800" font-size="50" letter-spacing="-2.75" fill="#FFFFFF">MUHAMMED YASSIR KHAN</text>

  <!-- cycling role, mono, muted -->
  <g font-family="'JetBrains Mono', Menlo, Consolas, ui-monospace, monospace" font-size="15" fill="#8A8A8A">
    <text class="role a" x="179" y="186">Real-time computer vision, in production.</text>
    <text class="role b" x="179" y="186">Agentic LLM apps that take actions, not turns.</text>
    <text class="role c" x="179" y="186">Multi-tenant SaaS, shipped and monitored.</text>
  </g>

  <!-- footer -->
  <rect x="56" y="270" width="1088" height="1" fill="#2A2A2A"/>
  <g font-family="'JetBrains Mono', Menlo, Consolas, ui-monospace, monospace" font-size="11" letter-spacing="1.6" fill="#8A8A8A">
    <rect x="56" y="288" width="7" height="7" fill="#FFFFFF"/>
    <text x="75"   y="295">MYK PRODUCTIONS</text>
    <text x="320"  y="295">BENGALURU, INDIA</text>
    <text x="580"  y="295">B.TECH AI &amp; DATA SCIENCE</text>
    <text x="1144" y="295" text-anchor="end" fill="#FFFFFF">OPEN TO ROLES</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" fill="none" stroke="#2A2A2A" stroke-width="1"/>
</svg>
